# Creality K1C
# Version: v1.0.26
# Created: 2026-04-19
# Updated: 2026-08-01
# Nominal print volume: 220x220x250
# Configured XY travel: 229x218
#
# Main MCU:
#   Chip: GD32F303RET6
#   Board: CR4CU220812S12
#   Serial: /dev/ttyS7
#
# Nozzle MCU:
#   Chip: GD32F303CBT6
#   Serial: /dev/ttyS1
#
# Leveling MCU:
#   Chip: GD32E230F8P6
#   Serial: /dev/ttyS9
#
# This file retains the original Creality sensorless configuration layout
# because host-side scripts expect it to exist.

[include sensorless.cfg]
[include gcode_macro.cfg]

[mcu]
serial: /dev/ttyS7
baud: 230400
restart_method: command

[mcu nozzle_mcu]
serial: /dev/ttyS1
baud: 230400
restart_method: command

[mcu leveling_mcu]
serial: /dev/ttyS9
baud: 230400
restart_method: command

[bed_mesh]
speed: 500
horizontal_move_z: 8
mesh_min: 30, 27
mesh_max: 200, 193
probe_count: 3, 3
algorithm: lagrange

[idle_timeout]
timeout: 99999999

[virtual_sdcard]
path: /usr/data/printer_data/gcodes

[gcode_arcs]
resolution: 1.0

[firmware_retraction]
retract_length: 0.8
retract_speed: 20

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
sensor_mcu: mcu
min_temp: 0
max_temp: 100
gcode_id: MCU

[temperature_sensor nozzle_mcu_temp]
sensor_type: temperature_mcu
sensor_mcu: nozzle_mcu
min_temp: 0
max_temp: 100
gcode_id: NOZZLE_MCU

[temperature_sensor leveling_mcu_temp]
sensor_type: temperature_mcu
sensor_mcu: leveling_mcu
min_temp: 0
max_temp: 100
gcode_id: LEVELING_MCU

[temperature_sensor chamber_temp]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: 0
max_temp: 125

# PC5 is intentionally shared by chamber_temp and chamber_fan.
#
# PC0 is also currently shared by chamber_fan and output_pin fan1.
# Do not remove PC0 until all macro references to fan1 are checked.
[duplicate_pin_override]
pins: PC0, PC5

[temperature_fan chamber_fan]
pin: PC0
cycle_time: 0.010
hardware_pwm: false
max_power: 1.0
shutdown_speed: 0.0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: 0
max_temp: 70
control: watermark
max_delta: 2
target_temp: 55
max_speed: 1.0
min_speed: 0.0

[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 32
rotation_distance: 40.1548
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: -4
position_min: -4
position_max: 229
homing_speed: 36
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PA9
uart_address: 3
diag_pin: ^PB12
interpolate: true
run_current: 1.0
hold_current: 1.0
sense_resistor: 0.100
stealthchop_threshold: 0
# driver_IHOLDDELAY: 8
# driver_TPOWERDOWN: 20
# driver_TBL: 1
# driver_TOFF: 1
# driver_HEND: 0
# driver_HSTRT: 7
driver_SGTHRS: 85

[stepper_y]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PC3
microsteps: 32
rotation_distance: 40.0737
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: -1.5
position_min: -1.5
position_max: 218
homing_speed: 36
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PA10
uart_address: 3
diag_pin: ^PB13
interpolate: true
run_current: 1.0
hold_current: 1.0
sense_resistor: 0.100
stealthchop_threshold: 0
# driver_IHOLDDELAY: 8
# driver_TPOWERDOWN: 20
# driver_TBL: 1
# driver_TOFF: 1
# driver_HEND: 0
# driver_HSTRT: 7
driver_SGTHRS: 85

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8.008
gear_ratio: 64:20
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 255

[tmc2209 stepper_z]
uart_pin: PA11
uart_address: 3
diag_pin: ^PB14
run_current: 0.5
sense_resistor: 0.100
stealthchop_threshold: 0
# driver_IHOLDDELAY: 8
# driver_TPOWERDOWN: 20
# driver_TBL: 1
# driver_TOFF: 1
# driver_HEND: 2
# driver_HSTRT: 2
driver_SGTHRS: 0

[extruder]
step_pin: nozzle_mcu:PB1
dir_pin: nozzle_mcu:PB0
enable_pin: !nozzle_mcu:PB2
microsteps: 16
rotation_distance: 6.9
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nozzle_mcu:PB7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: nozzle_mcu:PA0
max_extrude_only_distance: 1000
max_extrude_cross_section: 80
pressure_advance: 0.04
pressure_advance_smooth_time: 0.040
control: pid
pid_kp: 26.810
pid_ki: 2.750
pid_kd: 65.349
min_temp: 0
max_temp: 320

[tmc2209 extruder]
uart_pin: nozzle_mcu:PB11
tx_pin: nozzle_mcu:PB10
uart_address: 3
run_current: 0.55
sense_resistor: 0.150
stealthchop_threshold: 0
# driver_IHOLDDELAY: 8
# driver_TPOWERDOWN: 20
# driver_TBL: 2
# driver_TOFF: 3
# driver_HEND: 0
# driver_HSTRT: 5

[heater_bed]
heater_pin: PB10
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_kp: 66.744
pid_ki: 0.871
pid_kd: 1278.985
min_temp: 0
max_temp: 115

[filament_switch_sensor filament_sensor]
switch_pin: !PC15
pause_on_runout: true
runout_gcode:
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G0 E30 F600
    G90
  {% endif %}

[filament_switch_sensor filament_sensor_2]
switch_pin: !nozzle_mcu:PA10
pause_on_runout: true

[multi_pin heater_fans]
pins: nozzle_mcu:PB5, PB2

[static_digital_output nozzle_fan_enable]
pins: nozzle_mcu: PB6

[heater_fan hotend_fan]
pin: multi_pin:heater_fans
heater: extruder
heater_temp: 40

[output_pin fan0]
pin: !nozzle_mcu:PB8
pwm: true
cycle_time: 0.010
hardware_pwm: false
value: 0
shutdown_value: 0
scale: 255

# Compatibility object retained until macro references are checked.
# Shares physical pin PC0 with temperature_fan chamber_fan.
[output_pin fan1]
pin: PC0
pwm: true
cycle_time: 0.010
hardware_pwm: false
value: 0
shutdown_value: 0
scale: 255

[output_pin LED]
pin: PB0
pwm: true
cycle_time: 0.010
value: 1

[adxl345]
cs_pin: nozzle_mcu:PA4
spi_speed: 5000000
axes_map: x, -z, y
spi_software_sclk_pin: nozzle_mcu:PA5
spi_software_mosi_pin: nozzle_mcu:PA7
spi_software_miso_pin: nozzle_mcu:PA6

[resonance_tester]
accel_chip: adxl345
accel_per_hz: 75
probe_points:
  110, 110, 10

[display_status]

[printer]
kinematics: corexy
max_velocity: 800
max_accel: 10300
max_z_velocity: 20
max_z_accel: 300
square_corner_velocity: 15

[pause_resume]

[exclude_object]
