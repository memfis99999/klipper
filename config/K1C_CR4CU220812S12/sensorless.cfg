# Creality K1C
# Configuration version: v1.0.25
# Created: 2026-04-19
#
# Nominal print volume: 220x220x250
# Configured XY travel: 229x218
#
# Main MCU:
#   Chip: GD32F303RET6
#   Board: CR4CU220812S12
#   Serial: /dev/ttyS7
#
# Nozzle MCU:
#   Chip: GD32F303CBT6
#   Serial: /dev/ttyS1
#
# Leveling MCU:
#   Chip: GD32E230F8P6
#   Serial: /dev/ttyS9
#
# This file retains the original Creality sensorless configuration layout
# because host-side scripts expect it to exist.

[force_move]
enable_force_move: true


[bltouch]
sensor_pin: nozzle_mcu:PA9
control_pin: nozzle_mcu:PA8

pin_move_time: 0.68
stow_on_each_sample: true
probe_with_touch_mode: false

x_offset: 0
y_offset: 25
z_offset: 0.23

speed: 5
lift_speed: 20

samples: 3
samples_result: average
samples_tolerance: 0.1
samples_tolerance_retries: 4


[homing_override]
axes: xyz

gcode:
  M220 S100
  BED_MESH_CLEAR

  {% set home_all = 'X' not in params and
                    'Y' not in params and
                    'Z' not in params %}

  {% set do_x = home_all or 'X' in params %}
  {% set do_y = home_all or 'Y' in params %}
  {% set do_z = home_all or 'Z' in params %}

  {% set x_homed = 'x' in printer.toolhead.homed_axes %}
  {% set y_homed = 'y' in printer.toolhead.homed_axes %}
  {% set z_homed = 'z' in printer.toolhead.homed_axes %}

  {% set safe_z = 10.0 %}

  SAVE_GCODE_STATE NAME=STATE_G28
  G90

  # Raise the toolhead before any XY homing movement.
  {% if z_homed %}
    {% if printer.toolhead.position.z < safe_z %}
      G1 Z{safe_z} F1200
    {% endif %}
  {% else %}
    FORCE_MOVE STEPPER=stepper_z DISTANCE={safe_z} VELOCITY=10
    G4 P1000
  {% endif %}

  # Z homing requires valid X and Y coordinates.
  {% if do_z and (not x_homed or not y_homed) %}
    {% set do_x = true %}
    {% set do_y = true %}
  {% endif %}

  # First sensorless homing pass.
  {% if do_x %}
    G28 X
    G1 X10 F6000
    G4 P1000
  {% endif %}

  {% if do_y %}
    G28 Y
    G1 Y10 F6000
    G4 P1000
  {% endif %}

  # Second sensorless homing pass.
  {% if do_x %}
    G28 X
    G1 X10 F6000
    G4 P1000
  {% endif %}

  {% if do_y %}
    G28 Y
    G1 Y10 F6000
    G4 P1000
  {% endif %}

  {% if do_z %}
    {% set position_x = printer.toolhead.axis_maximum.x / 2 %}
    {% set position_y = printer.toolhead.axis_maximum.y / 2 %}

    G1 X{position_x} Y{position_y} F9000
    G4 P1000
    G28 Z
    G1 Z{safe_z} F1200
  {% endif %}

  RESTORE_GCODE_STATE NAME=STATE_G28

  # BED_MESH_PROFILE LOAD=default
  G4 P500
